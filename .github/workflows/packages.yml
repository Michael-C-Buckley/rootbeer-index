name: Package index
on:
  pull_request:
    branches: [main]
    paths: ["engine-revision", "packages/**"]
  workflow_dispatch:
    inputs:
      plan-only:
        description: Report reuse and required qualification without building packages
        type: boolean
        default: false
      recheck:
        description: Rebuild and recheck every package
        type: boolean
        default: false
  workflow_call:
    inputs:
      plan-only:
        description: Report reuse and required qualification without building packages
        type: boolean
        default: false
      recheck:
        description: Rebuild and recheck every package
        type: boolean
        default: false
      catalog:
        description: Directory containing the recipes to verify
        type: string
        default: packages
      candidates:
        description: Artifact holding candidate recipes to download before verifying
        type: string
        default: ""
      retention-days:
        description: How long to retain the verified bundle
        type: number
        default: 14

permissions:
  contents: read

concurrency:
  group: index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.repository.private != true
    permissions:
      contents: read
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.recheck && 170 || 75 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-engine
        id: engine
        with:
          runner: ${{ matrix.runner }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.candidates != ''
        with:
          name: ${{ inputs.candidates }}
          path: candidates
      - uses: ./.github/actions/prepare-package-results
        id: results
        with:
          recheck: ${{ inputs.recheck }}
          runner: ${{ matrix.runner }}
      - uses: ./.github/actions/export-packages
        id: export
        timeout-minutes: ${{ inputs.recheck && 150 || 55 }}
        with:
          timeout-seconds: ${{ inputs.recheck && 8700 || 3000 }}
          cache-context: ${{ steps.results.outputs.cache-context }}
          recheck: ${{ inputs.recheck }}
          catalog: ${{ inputs.catalog || 'packages' }}
          plan-only: ${{ inputs.plan-only }}
      - name: Retain package work plan
        if: ${{ !cancelled() && hashFiles('package-plan.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-plan-${{ matrix.runner }}-${{ github.run_attempt }}
          path: package-plan.json
          retention-days: ${{ inputs.retention-days || 14 }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && inputs.plan-only != true && steps.export.outcome == 'success' }}
        with:
          name: packages-${{ matrix.runner }}
          overwrite: true
          path: result/
          retention-days: ${{ inputs.retention-days || 14 }}
          if-no-files-found: error
      - name: Save verified package results
        if: ${{ !cancelled() && inputs.plan-only != true && steps.results.outcome == 'success' && steps.export.outputs.quiescent == 'true' }}
        uses: ./.github/actions/save-package-results
        with:
          key: ${{ steps.results.outputs.cache-key }}

  assemble:
    if: inputs.plan-only != true
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-engine
        with:
          runner: ubuntu-24.04
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-*
          path: inputs
      - name: Require complete version and platform coverage
        run: engine-bin/rootbeer-forge assemble --inputs inputs --output bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-bundle
          overwrite: true
          path: bundle/
          retention-days: ${{ inputs.retention-days || 14 }}
          if-no-files-found: error
