name: Package index
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require a pinned package engine
        env:
          ENGINE_REV: ${{ vars.ROOTBEER_REV }}
        run: '[[ "$ENGINE_REV" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v6
        with:
          repository: tale/rootbeer
          ref: ${{ vars.ROOTBEER_REV }}
          path: engine
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Identify Rust toolchain
        id: rust
        run: echo "version=$(rustc --version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Cache package engine
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: engine-verify-v1-${{ matrix.runner }}-${{ steps.rust.outputs.version }}-${{ vars.ROOTBEER_REV }}-${{ hashFiles('engine/Cargo.lock') }}
      - name: Build package engine
        working-directory: engine
        run: cargo build --locked --release --bin rb
      - name: Build, test, and export recipes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: engine/target/release/rb package --catalog recipes export --registry tale/rootbeer-index --output result
      - uses: actions/upload-artifact@v6
        with:
          name: packages-${{ matrix.runner }}
          path: result/
          retention-days: 2
          if-no-files-found: error

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLISH_INDEX == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: package-publishing
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: tale/rootbeer
          ref: ${{ vars.ROOTBEER_REV }}
          path: engine
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Identify Rust toolchain
        id: rust
        run: echo "version=$(rustc --version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Cache package engine
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: engine-publish-v1-ubuntu-24.04-${{ steps.rust.outputs.version }}-${{ vars.ROOTBEER_REV }}-${{ hashFiles('engine/Cargo.lock') }}
      - name: Build verifier and signer
        working-directory: engine
        run: cargo build --locked --release --bin rb
      - uses: actions/download-artifact@v6
        with:
          pattern: packages-*
          path: inputs
      - name: Require complete platform coverage
        run: engine/target/release/rb package assemble --inputs inputs --output bundle
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.3.0
      - name: Restore retained Pages history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git init -b gh-pages site
          git -C site remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          refs=$(git -C site ls-remote --heads origin gh-pages)
          if [ -n "$refs" ]; then
            git -C site fetch --depth=1 origin gh-pages
            git -C site reset --hard FETCH_HEAD
          fi
      - name: Authenticate publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Upload blobs and sign snapshot
        env:
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}
          INDEX_PUBLIC_KEY: ${{ vars.INDEX_PUBLIC_KEY }}
          INDEX_URL: ${{ vars.INDEX_URL }}
        run: |
          sequence=$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))
          umask 077
          key="$RUNNER_TEMP/index-signing-key.der"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$INDEX_SIGNING_KEY" | base64 --decode > "$key"
          unset INDEX_SIGNING_KEY
          engine/target/release/rb package publish --bundle bundle --site site \
            --site-url "$INDEX_URL" --registry tale/rootbeer-index --sequence "$sequence" \
            --repository-url "https://github.com/$GITHUB_REPOSITORY" \
            --key "$key" --public-key "$INDEX_PUBLIC_KEY"
      - name: Retain immutable snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C site add public
          git -C site commit -m "publish package snapshot ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          git -C site push origin HEAD:gh-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public
      - uses: actions/deploy-pages@v4
