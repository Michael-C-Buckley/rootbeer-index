name: Package index
on:
  push:
    branches: [main]
    paths: ["packages/**", ".github/workflows/packages.yml", ".github/actions/**"]
  pull_request:
    branches: [main]
    paths: ["packages/**", ".github/workflows/packages.yml", ".github/actions/**"]
  workflow_dispatch:
    inputs:
      recheck:
        description: Rebuild and recheck every package
        type: boolean
        default: false
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  engine:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-engine
        with:
          revision: ${{ vars.ROOTBEER_REV }}
          runner: ${{ matrix.runner }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-${{ matrix.runner }}
          path: engine/target/release/rb
          retention-days: 2
          if-no-files-found: error

  verify:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engine-${{ matrix.runner }}
          path: engine-bin
      - run: chmod +x engine-bin/rb
      - uses: ./.github/actions/export-packages
        with:
          revision: ${{ vars.ROOTBEER_REV }}
          runner: ${{ matrix.runner }}
          engine: engine-bin/rb
          shard: ${{ matrix.shard }}
          shards: 8
          recheck: ${{ github.event_name == 'schedule' || inputs.recheck == true }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.runner }}-${{ matrix.shard }}
          path: result/
          retention-days: 2
          if-no-files-found: error

  assemble:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engine-ubuntu-24.04
          path: engine-bin
      - run: chmod +x engine-bin/rb
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-*
          path: inputs
      - name: Require complete version and platform coverage
        run: engine-bin/rb package assemble --inputs inputs --output bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-bundle
          path: bundle/
          retention-days: 2
          if-no-files-found: error

  publish:
    needs: assemble
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLISH_INDEX == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: package-publishing
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: engine-ubuntu-24.04
          path: engine-bin
      - run: chmod +x engine-bin/rb
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-bundle
          path: bundle
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.0
      - name: Restore retained Pages history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git init -b gh-pages site
          git -C site remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          refs=$(git -C site ls-remote --heads origin gh-pages)
          if [ -n "$refs" ]; then
            git -C site fetch --depth=1 origin gh-pages
            git -C site reset --hard FETCH_HEAD
          fi
      - name: Authenticate publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Upload blobs and sign snapshot
        env:
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}
          INDEX_PUBLIC_KEY: ${{ vars.INDEX_PUBLIC_KEY }}
          INDEX_URL: ${{ vars.INDEX_URL }}
        run: |
          sequence=$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))
          umask 077
          key="$RUNNER_TEMP/index-signing-key.der"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$INDEX_SIGNING_KEY" | base64 --decode > "$key"
          unset INDEX_SIGNING_KEY
          engine-bin/rb package publish --bundle bundle --site site \
            --site-url "$INDEX_URL" --registry tale/rootbeer-index --sequence "$sequence" \
            --repository-url "https://github.com/$GITHUB_REPOSITORY" \
            --key "$key" --public-key "$INDEX_PUBLIC_KEY" --manifest latest-v2.json
      - name: Retain immutable snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C site add public
          git -C site commit -m "publish package snapshot ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          git -C site push origin HEAD:gh-pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/public
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
