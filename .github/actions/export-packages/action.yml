name: Export packages
description: Build and qualify packages, reusing verified results for compatible engine inputs and build environments.
inputs:
  build-cache-key:
    description: Disposable compiler and download cache key
    required: true
  build-cache-prefix:
    description: Restore prefix for disposable compiler and download caches
    required: true
  shards:
    description: Total number of stable package batches
    default: "4"
  shard:
    description: Zero-based package batch
    required: true
  timeout-seconds:
    description: Forge execution budget, leaving time for cleanup and retention
    default: "3000"
  cache-context:
    description: Build environment identity from prepare-package-results
    required: true
  catalog:
    description: Directory containing package definitions
    default: packages
  engine:
    description: Path to the package engine executable
    default: engine-bin/rootbeer-forge
  plan-only:
    description: Report the package plan without executing builds or checks
    default: "false"
  recheck:
    description: Rebuild and recheck every package
    default: "false"
outputs:
  has-work:
    description: Whether this batch requires qualification
    value: ${{ steps.plan.outputs.has-work }}
  quiescent:
    description: Forge returned after stopping its workers
    value: ${{ steps.export.outputs.quiescent }}
runs:
  using: composite
  steps:
    - name: Plan package qualification
      id: plan
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        CACHE_CONTEXT: ${{ inputs.cache-context }}
        SHOULD_RECHECK: ${{ inputs.recheck }}
        CATALOG: ${{ inputs.catalog }}
        ENGINE: ${{ inputs.engine }}
        SHARDS: ${{ inputs.shards }}
        SHARD: ${{ inputs.shard }}
      run: |
        options=(--shard "$SHARD" --shards "$SHARDS")
        if [ "$SHOULD_RECHECK" = true ] && [ "$GITHUB_RUN_ATTEMPT" = 1 ]; then options+=(--recheck); fi
        "$ENGINE" --catalog "$CATALOG" check
        "$ENGINE" --catalog "$CATALOG" export --plan \
          --registry tale/rootbeer-index --output package-plan.json \
          --cache .package-results --cache-context "$CACHE_CONTEXT" "${options[@]}"
        python3 - <<'PYTHON'
        import collections, json, os
        with open('package-plan.json') as source:
            plan = json.load(source)
        counts = collections.Counter(item['action'] for item in plan['packages'].values())
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
            summary.write(f"Package plan: {counts['reuse']} reusable, {counts['qualify']} need qualification.\n")
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f"has-work={str(counts['qualify'] > 0).lower()}\n")
        PYTHON
    - name: Restore compilation work only for batches that need it
      if: inputs.plan-only != 'true' && steps.plan.outputs.has-work == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .package-results/builds/compiler
          .package-results/builds/downloads
        key: ${{ inputs.build-cache-key }}
        restore-keys: ${{ inputs.build-cache-prefix }}
    - name: Build, test, and export recipes
      id: export
      if: inputs.plan-only != 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        CACHE_CONTEXT: ${{ inputs.cache-context }}
        SHOULD_RECHECK: ${{ inputs.recheck }}
        CATALOG: ${{ inputs.catalog }}
        ENGINE: ${{ inputs.engine }}
        SHARDS: ${{ inputs.shards }}
        SHARD: ${{ inputs.shard }}
        BUILD_TIMEOUT: ${{ inputs.timeout-seconds }}
      run: |
        if [ "$(uname -s)" = Darwin ]; then
          jobs=$(sysctl -n hw.logicalcpu)
        else
          jobs=$(getconf _NPROCESSORS_ONLN)
        fi
        if [ "$jobs" -gt 64 ]; then jobs=64; fi
        options=(--shard "$SHARD" --shards "$SHARDS")
        if [ "$SHOULD_RECHECK" = true ] && [ "$GITHUB_RUN_ATTEMPT" = 1 ]; then options+=(--recheck); fi
        status=0
        "$ENGINE" --catalog "$CATALOG" export --timeout "$BUILD_TIMEOUT" \
          --registry tale/rootbeer-index --output "$RUNNER_TEMP/package-result" --workers 1 --jobs "$jobs" \
          --cache .package-results --cache-context "$CACHE_CONTEXT" "${options[@]}" || status=$?
        if [ "$status" -le 1 ]; then echo "quiescent=true" >> "$GITHUB_OUTPUT"; fi
        if [ "$status" != 0 ]; then exit "$status"; fi
        mv "$RUNNER_TEMP/package-result" result
