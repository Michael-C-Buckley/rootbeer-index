name: Save package results
description: Retain verified batch checkpoints independently from disposable compiler caches.
inputs:
  has-work:
    description: Whether this batch needed qualification
    default: "true"
  shards:
    description: Total number of stable package batches
    default: "4"
  key:
    description: Verified result cache key
    required: true
  build-cache-key:
    description: Disposable compiler and download cache key
    required: true
  cache-context:
    description: Build environment identity
    required: true
  runner:
    description: Runner image label
    required: true
  shard:
    description: Zero-based package batch
    required: true
  catalog:
    description: Catalog verified by this batch
    default: packages
  retention-days:
    description: How long to retain retry checkpoints
    default: "14"
runs:
  using: composite
  steps:
    - name: Checkpoint completed qualifications
      shell: bash
      env:
        CATALOG: ${{ inputs.catalog }}
        SHARDS: ${{ inputs.shards }}
        SHARD: ${{ inputs.shard }}
        CACHE_CONTEXT: ${{ inputs.cache-context }}
      run: |
        rm -rf retained-results
        engine-bin/rootbeer-forge --catalog "$CATALOG" checkpoint-results \
          --cache .package-results --output retained-results --shard "$SHARD" --shards "$SHARDS"
        mkdir retry-checkpoint
        printf '%s\n' "$CACHE_CONTEXT" > retry-checkpoint/environment
        tar -czf retry-checkpoint/results.tar.gz -C retained-results .
    - name: Retain retry checkpoint
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: results-${{ inputs.runner }}-${{ inputs.shard }}-${{ github.run_attempt }}
        path: retry-checkpoint/
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error
    - name: Cache verified results for future runs
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: retained-results
        key: ${{ inputs.key }}
    - name: Cache compilation work
      if: inputs.has-work == 'true'
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .package-results/builds/compiler
          .package-results/builds/downloads
        key: ${{ inputs.build-cache-key }}
