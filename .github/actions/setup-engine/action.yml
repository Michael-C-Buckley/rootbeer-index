name: Set up package engine
description: Build the pinned Rootbeer engine with a separate cache for publishing.
inputs:
  revision:
    description: Full Rootbeer commit SHA
    required: true
  runner:
    description: Runner image label used by the job
    required: true
  cache-scope:
    description: Engine cache namespace (verify or publish)
    default: verify
runs:
  using: composite
  steps:
    - name: Validate engine configuration
      shell: bash
      env:
        ENGINE_REV: ${{ inputs.revision }}
        CACHE_SCOPE: ${{ inputs.cache-scope }}
      run: |
        [[ "$ENGINE_REV" =~ ^[0-9a-f]{40}$ ]]
        [[ "$CACHE_SCOPE" =~ ^(verify|publish)$ ]]
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: tale/rootbeer
        ref: ${{ inputs.revision }}
        path: engine
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      with:
        toolchain: stable
    - name: Identify Rust toolchain
      id: rust
      shell: bash
      run: echo "version=$(rustc --version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
    - name: Cache package engine
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          engine/target
        key: engine-${{ inputs.cache-scope }}-v1-${{ inputs.runner }}-${{ steps.rust.outputs.version }}-${{ inputs.revision }}-${{ hashFiles('engine/Cargo.lock') }}
        restore-keys: |
          engine-${{ inputs.cache-scope }}-v1-${{ inputs.runner }}-${{ steps.rust.outputs.version }}-
    - name: Build package engine
      shell: bash
      working-directory: engine
      run: |
        export RB_BUILD_TIMESTAMP="$(git show -s --format=%cI HEAD)"
        cargo build --locked --release --bin rb
