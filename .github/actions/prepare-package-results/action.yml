name: Prepare package results
description: Identify the build environment and restore verified package results.
inputs:
  shards:
    description: Total number of stable package batches
    default: "4"
  shard:
    description: Zero-based package batch
    required: true
  runner:
    description: Runner image label
    required: true
  recheck:
    description: Start a fresh recheck and recover only results from this run
    default: "false"
outputs:
  cache-key:
    description: Key for saving completed results
    value: ${{ steps.cache.outputs.cache-primary-key }}
  build-cache-key:
    description: Disposable download and compiler cache key
    value: ${{ steps.scope.outputs.build-prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
  build-cache-prefix:
    description: Restore prefix for disposable compiler and download caches
    value: ${{ steps.scope.outputs.build-prefix }}-
  cache-context:
    description: Build environment identity
    value: ${{ steps.environment.outputs.digest }}
runs:
  using: composite
  steps:
    - name: Install package Rust toolchain
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
      env:
        RUSTUP_CONCURRENT_DOWNLOADS: "1"
      with:
        toolchain: 1.98.1
    - name: Install Go toolchain
      uses: actions/setup-go@e626ada899467caf4efc6cfd0484b965da944ce8
      with:
        go-version: "1.27.1"
        cache: false

    - name: Identify package build environment
      id: environment
      shell: bash
      run: |
        : "${ImageOS:?}" "${ImageVersion:?}" "${RUNNER_ARCH:?}"
        {
          printf '%s\n' "$ImageOS" "$ImageVersion" "$RUNNER_ARCH"
          cc --version
          make --version
        } > "$RUNNER_TEMP/package-environment"
        echo "digest=$(shasum -a 256 "$RUNNER_TEMP/package-environment" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
    - name: Select result cache scope
      id: scope
      shell: bash
      env:
        SHOULD_RECHECK: ${{ inputs.recheck }}
        RESULT_RUNNER: ${{ inputs.runner }}
        RESULT_SHARDS: ${{ inputs.shards }}
        RESULT_SHARD: ${{ inputs.shard }}
        RESULT_CONTEXT: ${{ steps.environment.outputs.digest }}
      run: |
        scope="results-v6-$RESULT_RUNNER-$RESULT_CONTEXT-shard-$RESULT_SHARD-of-$RESULT_SHARDS"
        build_scope="compilers-v1-$RESULT_RUNNER-$RESULT_CONTEXT-$RESULT_SHARD"
        if [ "$SHOULD_RECHECK" = true ]; then
          scope="$scope-recheck-$GITHUB_RUN_ID"
          build_scope="$build_scope-recheck-$GITHUB_RUN_ID"
        fi
        echo "prefix=$scope" >> "$GITHUB_OUTPUT"
        echo "build-prefix=$build_scope" >> "$GITHUB_OUTPUT"
    - name: Restore verified package results
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: retained-results
        key: ${{ steps.scope.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ github.run_attempt == 1 && inputs.recheck != 'true' && format('{0}-', steps.scope.outputs.prefix) || '' }}
    - name: Use retained results
      if: steps.cache.outputs.cache-matched-key != '' && github.run_attempt == 1
      shell: bash
      run: mv retained-results .package-results
    - name: Restore results from before batching
      if: github.run_attempt == 1 && inputs.recheck != 'true' && steps.cache.outputs.cache-matched-key == ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .package-results
        key: results-v5-${{ inputs.runner }}-${{ steps.environment.outputs.digest }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          results-v5-${{ inputs.runner }}-${{ steps.environment.outputs.digest }}-
          results-v4-${{ inputs.runner }}-${{ steps.environment.outputs.digest }}-
    - name: Recover this batch's completed qualifications
      if: github.run_attempt > 1
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: results-${{ inputs.runner }}-${{ inputs.shard }}-*
        path: retry-results
    - name: Require the latest checkpoint on retry
      if: github.run_attempt > 1
      shell: bash
      env:
        CACHE_CONTEXT: ${{ steps.environment.outputs.digest }}
      run: |
        python3 - <<'PYTHON'
        import os, pathlib, subprocess
        checkpoints = list(pathlib.Path('retry-results').glob('results-*'))
        if not checkpoints:
            raise SystemExit('Retry checkpoint is missing; refusing to rebuild completed work.')
        latest = max(checkpoints, key=lambda path: int(path.name.rsplit('-', 1)[1]))
        if (latest / 'environment').read_text().strip() != os.environ['CACHE_CONTEXT']:
            raise SystemExit('The build environment changed; investigate before retrying.')
        pathlib.Path('.package-results').mkdir(exist_ok=True)
        subprocess.run(['tar', '-xzf', str(latest / 'results.tar.gz'), '-C', '.package-results'], check=True)
        PYTHON
    - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      if: github.run_attempt == 1 && inputs.recheck != 'true' && vars.DURABLE_PACKAGE_RESULTS != 'false'
      with:
        version: 1.3.0
    - name: Import approved durable qualifications
      if: github.run_attempt == 1 && inputs.recheck != 'true' && vars.DURABLE_PACKAGE_RESULTS != 'false'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        python3 .github/scripts/candidate-store.py seed
